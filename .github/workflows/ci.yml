name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

  benchmark-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate benchmark assets
        run: |
          springdocker benchmark generate \
            --project-root samples/java-spring-docker \
            --java-version 25

      - name: Assert generated assets stay untracked
        run: |
          if [ -n "$(git status --porcelain samples/java-spring-docker/benchmarks/)" ]; then
            echo "Generated benchmark files would be committed; update .gitignore or stop tracking them:"
            git status --porcelain samples/java-spring-docker/benchmarks/
            exit 1
          fi

      - name: Verify generated layout exists
        run: |
          test -f samples/java-spring-docker/benchmarks/01-multi-stage-build-structure/variants/specialized-multi-stage/Dockerfile
          test -f samples/java-spring-docker/benchmarks/07-native-benchmark/Dockerfile
          test -f samples/java-spring-docker/benchmarks/07-native-benchmark/README.md

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Type check
        run: mypy

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Benchmark regression gate
        run: |
          springdocker benchmark analyze \
            --project-root samples/java-spring-docker \
            benchmarks/06-base-image-choice/results/raw.csv \
            --baseline benchmarks/06-base-image-choice/results/baseline.json \
            --fail-on-regression-above 20

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            suite: unit
          - os: ubuntu-latest
            python-version: "3.10"
            suite: integration
          - os: ubuntu-latest
            python-version: "3.10"
            suite: e2e
          - os: ubuntu-latest
            python-version: "3.10"
            suite: benchmark
          - os: ubuntu-latest
            python-version: "3.12"
            suite: unit
          - os: ubuntu-latest
            python-version: "3.12"
            suite: integration
          - os: ubuntu-latest
            python-version: "3.12"
            suite: e2e
          - os: ubuntu-latest
            python-version: "3.12"
            suite: benchmark
          - os: macos-latest
            python-version: "3.12"
            suite: unit
          - os: windows-latest
            python-version: "3.12"
            suite: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test ${{ matrix.suite }}
        run: pytest tests/${{ matrix.suite }} --cov-fail-under=0

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Core module coverage gate
        run: |
          pytest -q \
            --cov=springdocker.dockerfile \
            --cov=springdocker.commands \
            --cov=springdocker.config \
            --cov-fail-under=85

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Vulnerability scan (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
