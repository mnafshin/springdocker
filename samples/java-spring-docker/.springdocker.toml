# springdocker project configuration — team exemplar
# Precedence: CLI flags > this file > built-in defaults
# Guide: docs/team-adoption.md

[project]
build_tool = "maven"

[doctor]
build_tool = "maven"

[dockerfile]
output = "Dockerfile.generated"
java_version = 25
recipe = "jvm-balanced"
profile = "production-balanced"
runtime_image = "distroless"
use_buildkit_cache = true
use_jlink = true
use_layered_jar = true
non_root = true
platform_aware = true
enable_appcds = true
enable_jep483_aot_cache = false
include_oci_labels = true
include_stopsignal = true
include_embedded_sbom = true
include_reproducible_controls = true
pin_digests = true
tuned_jvm_flags = true
# jvm_flags = ["-XX:MaxRAMPercentage=75", "-XX:+ExitOnOutOfMemoryError", "-Djava.io.tmpdir=/tmp"]
must_have_modules_file = "musthave_modules.txt"
jlink_baseline_modules = ["java.desktop", "java.logging", "java.naming"]

[benchmark.generate]
java_version = 25
legacy_scripts = false

[benchmark.generate.base_image_choice]
variants = ["alpine", "debian-slim", "ubuntu", "distroless"]

[benchmark.run]
profile = "quick"
runner_args = ["--skip-native"]
# cpuset_cpus = "0-1"
# memory_limit = "2g"
# warmup_runs = 1
# max_workers = 1
# normalized_runtime = false
legacy_scripts = false
